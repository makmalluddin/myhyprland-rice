background {
    monitor =
    path = ~/.config/hypr/wallpapers/lockscreen.png   # Ubah ke path wallpaper Anda
    color = rgba(25, 20, 20, 1.0)

    # Efek blur (opsional, sangat bagus jika pakai wallpaper)
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33 # Skala radius dot
    dots_spacing = 0.15 # Jarak antar dot
    dots_center = true
    outer_color = rgb(15, 15, 15)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>Input Password...</i> # Text saat kosong
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 90
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:43200000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(255, 255, 255, 0.9)
    font_size = 25
    font_family = JetBrains Mono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}
